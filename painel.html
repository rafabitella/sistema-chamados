<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Chamados (Admin)</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>Painel de Chamados - TI</h1>
        
        <div id="alerta-novo-chamado" style="display: none; background-color: #ffeb3b; padding: 10px; border-radius: 5px; font-weight: bold; margin-bottom: 20px;">
            🔔 Novo chamado recebido!
        </div>

        <h2>Chamados Recebidos</h2>
        <div id="lista-chamados">
            <p>Nenhum chamado no momento. Aguardando...</p>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        const listaChamados = document.getElementById('lista-chamados');
        const alerta = document.getElementById('alerta-novo-chamado');
        let primeiroChamado = true;

        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx = null;

        function getAudioContext() {
            if (!audioCtx) {
                audioCtx = new AudioContext();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            return audioCtx;
        }

        document.addEventListener('click', () => {
            getAudioContext();
        }, { once: true });

        function tocarSomNotificacao() {
            try {
                const ctx = getAudioContext();
                if (ctx.state === 'suspended') ctx.resume();

                const agora = ctx.currentTime;
                const osc1 = ctx.createOscillator();
                const gain1 = ctx.createGain();
                osc1.type = 'sine';
                osc1.frequency.setValueAtTime(587.33, agora);
                gain1.gain.setValueAtTime(0.3, agora);
                gain1.gain.exponentialRampToValueAtTime(0.01, agora + 0.15);
                osc1.connect(gain1);
                gain1.connect(ctx.destination);
                osc1.start(agora);
                osc1.stop(agora + 0.15);

                setTimeout(() => {
                    const osc2 = ctx.createOscillator();
                    const gain2 = ctx.createGain();
                    osc2.type = 'sine';
                    osc2.frequency.setValueAtTime(880, agora + 0.15);
                    gain2.gain.setValueAtTime(0.3, agora + 0.15);
                    gain2.gain.exponentialRampToValueAtTime(0.01, agora + 0.35);
                    osc2.connect(gain2);
                    gain2.connect(ctx.destination);
                    osc2.start(agora + 0.15);
                    osc2.stop(agora + 0.35);
                }, 150);
            } catch (e) {
                console.warn('Erro ao tocar som:', e);
            }
        }

        socket.on('receber_chamado', (chamado) => {
            tocarSomNotificacao();

            if (primeiroChamado) {
                listaChamados.innerHTML = '';
                primeiroChamado = false;
            }

            alerta.style.display = 'block';
            setTimeout(() => {
                alerta.style.display = 'none';
            }, 5000);

            const card = document.createElement('div');
            card.className = 'chamado';
            card.id = chamado.id;
            card.innerHTML = `
                <div class="conteudo-chamado">
                    <p><strong>Horário:</strong> ${chamado.hora}</p>
                    <p><strong>Nome:</strong> ${chamado.nome}</p>
                    <p><strong>Setor:</strong> ${chamado.setor}</p>
                    <p><strong>Problema:</strong> ${chamado.descricao}</p>
                    <div><span class="badge badge-pendente">Aguardando Suporte</span></div>
                </div>
                <div class="acoes-chamado">
                    <button class="btn-atender">Atender Chamado</button>
                    <button class="btn-concluir">Finalizar Chamado</button>
                </div>
            `;

            const btnAtender = card.querySelector('.btn-atender');
            const btnConcluir = card.querySelector('.btn-concluir');
            const badge = card.querySelector('.badge');

            // Quando o TI clica em "Atender"
            btnAtender.addEventListener('click', () => {
                badge.className = 'badge badge-analise';
                badge.textContent = 'Em Análise';
                btnAtender.remove(); // Remove o botão de atender, mantém só o de finalizar

                socket.emit('atualizar_status', { id: chamado.id, status: 'em_analise' });
            });

            // Quando o TI clica em "Finalizar"
            btnConcluir.addEventListener('click', () => {
                badge.className = 'badge badge-concluido';
                badge.textContent = 'Resolvido';
                card.classList.add('finalizado');
                card.querySelector('.acoes-chamado').remove(); // Remove todos os botões

                socket.emit('atualizar_status', { id: chamado.id, status: 'concluido' });
            });

            listaChamados.prepend(card);
        });
    </script>
</body>
</html>
