<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Chamados (Admin)</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>Painel de Chamados - TI</h1>

        <!-- Favicon SVG -->
        <link rel="icon" type="image/svg+xml" href="/imagens/levitta.svg">
        
        <div id="alerta-novo-chamado" style="display: none; background-color: #ffeb3b; padding: 10px; border-radius: 5px; font-weight: bold; margin-bottom: 20px;">
            🔔 Novo chamado recebido!
        </div>

        <h2>Chamados Recebidos</h2>
        <div id="lista-chamados">
            <p>Carregando histórico de chamados...</p>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        const listaChamados = document.getElementById('lista-chamados');
        const alerta = document.getElementById('alerta-novo-chamado');
        let primeiroChamado = true;

        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx = null;

        function getAudioContext() {
            if (!audioCtx) audioCtx = new AudioContext();
            if (audioCtx.state === 'suspended') audioCtx.resume();
            return audioCtx;
        }

        document.addEventListener('click', () => {
            getAudioContext();
        }, { once: true });

        function tocarSomNotificacao() {
            try {
                const ctx = getAudioContext();
                if (ctx.state === 'suspended') ctx.resume();

                const agora = ctx.currentTime;
                const osc1 = ctx.createOscillator();
                const gain1 = ctx.createGain();
                osc1.type = 'sine';
                osc1.frequency.setValueAtTime(587.33, agora);
                gain1.gain.setValueAtTime(0.3, agora);
                gain1.gain.exponentialRampToValueAtTime(0.01, agora + 0.15);
                osc1.connect(gain1);
                gain1.connect(ctx.destination);
                osc1.start(agora);
                osc1.stop(agora + 0.15);

                setTimeout(() => {
                    const osc2 = ctx.createOscillator();
                    const gain2 = ctx.createGain();
                    osc2.type = 'sine';
                    osc2.frequency.setValueAtTime(880, agora + 0.15);
                    gain2.gain.setValueAtTime(0.3, agora + 0.15);
                    gain2.gain.exponentialRampToValueAtTime(0.01, agora + 0.35);
                    osc2.connect(gain2);
                    gain2.connect(ctx.destination);
                    osc2.start(agora + 0.15);
                    osc2.stop(agora + 0.35);
                }, 150);
            } catch (e) {
                console.warn('Erro ao tocar som:', e);
            }
        }

        function criarCardChamado(chamado) {
            const card = document.createElement('div');
            card.className = `chamado ${chamado.status === 'concluido' ? 'finalizado' : ''}`;
            card.id = chamado.id;

            let badgeHtml = '<span class="badge badge-pendente">Aguardando Suporte</span>';
            if (chamado.status === 'em_analise') {
                badgeHtml = '<span class="badge badge-analise">Em Andamento</span>';
            } else if (chamado.status === 'concluido') {
                badgeHtml = '<span class="badge badge-concluido">Resolvido</span>';
            }

            let acoesHtml = '';
            if (chamado.status === 'aguardando') {
                acoesHtml = `
                    <div class="acoes-chamado">
                        <button class="btn-atender">Atender Chamado</button>
                        <button class="btn-concluir">Finalizar Chamado</button>
                    </div>
                `;
            } else if (chamado.status === 'em_analise') {
                acoesHtml = `
                    <div class="acoes-chamado">
                        <button class="btn-concluir">Finalizar Chamado</button>
                    </div>
                `;
            }

            let avaliacaoHtml = '';
            if (chamado.nota) {
                const estrelas = '★'.repeat(chamado.nota) + '☆'.repeat(5 - chamado.nota);
                avaliacaoHtml = `
                    <div class="card-avaliacao-ti">
                        <div class="estrelas-visualizacao">${estrelas} (${chamado.nota}/5)</div>
                        <p style="margin: 0; color: #444;">
                            ${chamado.comentario ? `"${chamado.comentario}"` : '<em>Sem comentário adicional.</em>'}
                        </p>
                    </div>
                `;
            }

            card.innerHTML = `
                <div class="conteudo-chamado">
                    <p><strong>Horário:</strong> ${chamado.hora}</p>
                    <p><strong>Nome:</strong> ${chamado.nome}</p>
                    <p><strong>Setor:</strong> ${chamado.setor}</p>
                    <p><strong>Problema:</strong> ${chamado.descricao}</p>
                    <div>${badgeHtml}</div>
                </div>

                <div class="chat-container">
                    <div class="chat-mensagens" id="chat-msgs-${chamado.id}">
                        <div class="balao-msg msg-suporte">
                            <span class="autor-msg">Sistema</span>
                            <span>Chat do chamado iniciado.</span>
                            <span class="hora-msg">${chamado.hora}</span>
                        </div>
                    </div>
                    <form class="chat-form" id="form-chat-${chamado.id}">
                        <input type="text" class="chat-input" placeholder="${chamado.status === 'concluido' ? 'Chamado finalizado.' : `Responder para ${chamado.nome}...`}" ${chamado.status === 'concluido' ? 'disabled' : ''} required autocomplete="off">
                        <button type="submit" class="btn-enviar-chat" ${chamado.status === 'concluido' ? 'disabled' : ''}>Responder</button>
                    </form>
                </div>

                <div class="area-avaliacao" id="avaliacao-${chamado.id}">${avaliacaoHtml}</div>
                ${acoesHtml}
            `;

            // Eventos dos botões
            const btnAtender = card.querySelector('.btn-atender');
            const btnConcluir = card.querySelector('.btn-concluir');
            const formChat = card.querySelector(`#form-chat-${chamado.id}`);
            const inputChat = formChat.querySelector('.chat-input');

            formChat.addEventListener('submit', (e) => {
                e.preventDefault();
                const texto = inputChat.value.trim();
                if (!texto) return;

                const dadosMsg = {
                    chamadoId: chamado.id,
                    autor: 'Suporte TI',
                    tipoOrigem: 'suporte',
                    texto: texto,
                    hora: new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' })
                };

                socket.emit('enviar_mensagem', dadosMsg);
                inputChat.value = '';
            });

            if (btnAtender) {
                btnAtender.addEventListener('click', () => {
                    const badge = card.querySelector('.badge');
                    badge.className = 'badge badge-analise';
                    badge.textContent = 'Em Andamento';
                    btnAtender.remove();
                    socket.emit('atualizar_status', { id: chamado.id, status: 'em_analise' });
                });
            }

            if (btnConcluir) {
                btnConcluir.addEventListener('click', () => {
                    const badge = card.querySelector('.badge');
                    badge.className = 'badge badge-concluido';
                    badge.textContent = 'Resolvido';
                    card.classList.add('finalizado');
                    const containerAcoes = card.querySelector('.acoes-chamado');
                    if (containerAcoes) containerAcoes.remove();
                    inputChat.disabled = true;
                    inputChat.placeholder = 'Chamado finalizado.';
                    socket.emit('atualizar_status', { id: chamado.id, status: 'concluido' });
                });
            }

            return card;
        }

        // Carrega todo o histórico gravado no banco SQLite
        socket.on('connect', () => {
            socket.emit('carregar_historico');
        });

        socket.on('historico_carregado', ({ chamados, mensagens }) => {
            listaChamados.innerHTML = '';
            if (!chamados || chamados.length === 0) {
                listaChamados.innerHTML = '<p>Nenhum chamado registrado no banco de dados.</p>';
                primeiroChamado = true;
                return;
            }

            primeiroChamado = false;
            chamados.forEach(ch => {
                const card = criarCardChamado(ch);
                listaChamados.appendChild(card);
            });

            // Insere as mensagens salvas nos respectivos chats
            mensagens.forEach(msg => {
                const containerMsgs = document.getElementById(`chat-msgs-${msg.chamado_id}`);
                if (containerMsgs) {
                    const tipoClasse = msg.tipoOrigem === 'suporte' ? 'msg-suporte' : 'msg-usuario';
                    const balao = document.createElement('div');
                    balao.className = `balao-msg ${tipoClasse}`;
                    balao.innerHTML = `
                        <span class="autor-msg">${msg.autor}</span>
                        <span>${msg.texto}</span>
                        <span class="hora-msg">${msg.hora}</span>
                    `;
                    containerMsgs.appendChild(balao);
                    containerMsgs.scrollTop = containerMsgs.scrollHeight;
                }
            });
        });

        // Quando chega um novo chamado em tempo real
        socket.on('receber_chamado', (chamado) => {
            tocarSomNotificacao();

            if (primeiroChamado) {
                listaChamados.innerHTML = '';
                primeiroChamado = false;
            }

            alerta.style.display = 'block';
            setTimeout(() => { alerta.style.display = 'none'; }, 5000);

            const card = criarCardChamado(chamado);
            listaChamados.prepend(card);
        });

        socket.on('nova_mensagem', (msg) => {
            const containerMsgs = document.getElementById(`chat-msgs-${msg.chamadoId || msg.chamado_id}`);
            if (containerMsgs) {
                const tipoClasse = msg.tipoOrigem === 'suporte' ? 'msg-suporte' : 'msg-usuario';
                const balao = document.createElement('div');
                balao.className = `balao-msg ${tipoClasse}`;
                balao.innerHTML = `
                    <span class="autor-msg">${msg.autor}</span>
                    <span>${msg.texto}</span>
                    <span class="hora-msg">${msg.hora}</span>
                `;
                containerMsgs.appendChild(balao);
                containerMsgs.scrollTop = containerMsgs.scrollHeight;
            }
        });

        socket.on('nova_avaliacao', (dados) => {
            const containerAvaliacao = document.getElementById(`avaliacao-${dados.chamadoId}`);
            if (containerAvaliacao) {
                const estrelas = '★'.repeat(dados.nota) + '☆'.repeat(5 - dados.nota);
                containerAvaliacao.innerHTML = `
                    <div class="card-avaliacao-ti">
                        <div class="estrelas-visualizacao">${estrelas} (${dados.nota}/5)</div>
                        <p style="margin: 0; color: #444;">
                            ${dados.comentario ? `"${dados.comentario}"` : '<em>Sem comentário adicional.</em>'}
                        </p>
                    </div>
                `;
            }
        });
    </script>
</body>
</html>
