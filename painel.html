<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Chamados (Admin)</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>Painel de Chamados - TI</h1>
        
        <!-- O aviso instantâneo ficará escondido aqui -->
        <div id="alerta-novo-chamado" style="display: none; background-color: #ffeb3b; padding: 10px; border-radius: 5px; font-weight: bold; margin-bottom: 20px;">
            🔔 Novo chamado recebido!
        </div>

        <!-- Lista onde os chamados vão aparecer -->
        <h2>Chamados Abertos</h2>
        <div id="lista-chamados">
            <!-- O JavaScript vai inserir os chamados aqui dentro no formato abaixo:
                 <div class="chamado">
                     <strong>Nome:</strong> João <br>
                     <strong>Problema:</strong> Computador não liga
                 </div>
            -->
            <p>Nenhum chamado no momento. Aguardando...</p>
        </div>
    </div>
    <script src="/socket.io/socket.io.js"></script>
    <!-- Importação do Socket.io -->
    <script src="/socket.io/socket.io.js"></script>
    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        const listaChamados = document.getElementById('lista-chamados');
        const alerta = document.getElementById('alerta-novo-chamado');
        let primeiroChamado = true;

        function tocarSomNotificacao() {
            try {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                const audioCtx = new AudioContext();

                const osc1 = audioCtx.createOscillator();
                const gain1 = audioCtx.createGain();
                osc1.type = 'sine';
                osc1.frequency.setValueAtTime(587.33, audioCtx.currentTime);
                gain1.gain.setValueAtTime(0.2, audioCtx.currentTime);
                gain1.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
                osc1.connect(gain1);
                gain1.connect(audioCtx.destination);
                osc1.start();
                osc1.stop(audioCtx.currentTime + 0.2);

                setTimeout(() => {
                    const osc2 = audioCtx.createOscillator();
                    const gain2 = audioCtx.createGain();
                    osc2.type = 'sine';
                    osc2.frequency.setValueAtTime(880, audioCtx.currentTime);
                    gain2.gain.setValueAtTime(0.2, audioCtx.currentTime);
                    gain2.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                    osc2.connect(gain2);
                    gain2.connect(audioCtx.destination);
                    osc2.start();
                    osc2.stop(audioCtx.currentTime + 0.3);
                }, 150);
            } catch (e) {
                console.log('Reprodução de áudio bloqueada ou não suportada:', e);
            }
        }

        socket.on('receber_chamado', (chamado) => {
            tocarSomNotificacao();

            if (primeiroChamado) {
                listaChamados.innerHTML = '';
                primeiroChamado = false;
            }

            alerta.style.display = 'block';
            setTimeout(() => {
                alerta.style.display = 'none';
            }, 5000);

            // Cria o card do chamado
            const card = document.createElement('div');
            card.className = 'chamado';
            card.innerHTML = `
                <div class="conteudo-chamado">
                    <p><strong>Horário:</strong> ${chamado.hora}</p>
                    <p><strong>Nome:</strong> ${chamado.nome}</p>
                    <p><strong>Setor:</strong> ${chamado.setor}</p>
                    <p><strong>Problema:</strong> ${chamado.descricao}</p>
                </div>
                <button class="btn-concluir">Concluir Atendimento</button>
            `;

            // Ação ao clicar no botão "Concluir"
            const btnConcluir = card.querySelector('.btn-concluir');
            btnConcluir.addEventListener('click', () => {
                card.classList.add('finalizado');
                btnConcluir.remove(); // Remove o botão

                const badge = document.createElement('span');
                badge.className = 'badge-concluido';
                badge.textContent = 'Resolvido';
                card.appendChild(badge);
            });

            listaChamados.prepend(card);
        });
    </script>
</body>
</html>
</body>
